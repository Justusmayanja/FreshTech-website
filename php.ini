[PHP]
short_open_tag = On
error_reporting = E_ALL
display_errors = On
log_errors = On
; Use XAMPP PHP extensions directory to match php.exe in PATH
extension_dir = C:\xampp\php\ext
; Load extensions using module names compatible with XAMPP PHP
extension = pdo_mysql
extension = mysqli
extension = curl
extension = openssl
date.timezone = Africa/Kampala

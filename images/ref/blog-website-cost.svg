<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400"><stop offset="0%" stop-color="#FEF2F2"/><stop offset="100%" stop-color="#FEE2E2"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Calculator -->
  <rect x="180" y="60" width="240" height="280" rx="16" fill="white" stroke="#FECACA" stroke-width="2"/>
  <rect x="200" y="80" width="200" height="50" rx="8" fill="#1F2937"/>
  <text x="380" y="115" text-anchor="end" font-family="Arial" font-size="28" font-weight="bold" fill="#10B981">KES 150,000</text>
  <!-- Calculator buttons -->
  <rect x="200" y="145" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="222" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">7</text>
  <rect x="252" y="145" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="274" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">8</text>
  <rect x="304" y="145" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="326" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">9</text>
  <rect x="356" y="145" width="45" height="35" rx="6" fill="#FEE2E2"/><text x="378" y="168" text-anchor="middle" font-family="Arial" font-size="14" fill="#db1a1a">×</text>
  <rect x="200" y="188" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="222" y="211" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">4</text>
  <rect x="252" y="188" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="274" y="211" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">5</text>
  <rect x="304" y="188" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="326" y="211" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">6</text>
  <rect x="356" y="188" width="45" height="35" rx="6" fill="#FEE2E2"/><text x="378" y="211" text-anchor="middle" font-family="Arial" font-size="14" fill="#db1a1a">−</text>
  <rect x="200" y="231" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="222" y="254" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">1</text>
  <rect x="252" y="231" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="274" y="254" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">2</text>
  <rect x="304" y="231" width="45" height="35" rx="6" fill="#F3F4F6"/><text x="326" y="254" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">3</text>
  <rect x="356" y="231" width="45" height="35" rx="6" fill="#FEE2E2"/><text x="378" y="254" text-anchor="middle" font-family="Arial" font-size="14" fill="#db1a1a">+</text>
  <rect x="200" y="274" width="97" height="35" rx="6" fill="#F3F4F6"/><text x="248" y="297" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">0</text>
  <rect x="304" y="274" width="97" height="35" rx="6" fill="#db1a1a"/><text x="352" y="297" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">=</text>
  <!-- Price tags floating -->
  <g transform="translate(60, 80)">
    <rect width="100" height="40" rx="8" fill="#db1a1a" transform="rotate(-10)"/>
    <text x="30" y="22" font-family="Arial" font-size="11" font-weight="bold" fill="white" transform="rotate(-10)">KES 150K</text>
  </g>
  <g transform="translate(440, 100)">
    <rect width="100" height="40" rx="8" fill="#193d77" transform="rotate(8)"/>
    <text x="18" y="25" font-family="Arial" font-size="11" font-weight="bold" fill="white" transform="rotate(8)">KES 250K</text>
  </g>
  <g transform="translate(460, 280)">
    <rect width="100" height="40" rx="8" fill="#10B981" transform="rotate(-5)"/>
    <text x="16" y="25" font-family="Arial" font-size="11" font-weight="bold" fill="white" transform="rotate(-5)">KES 400K</text>

<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Phone mockup -->
  <rect x="80" y="50" width="180" height="300" rx="20" fill="#1F2937"/>
  <rect x="92" y="75" width="156" height="255" rx="4" fill="white"/>
  <!-- M-Pesa screen -->
  <rect x="92" y="75" width="156" height="40" fill="#4CAF50"/>
  <text x="170" y="100" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="white">M-PESA</text>
  <!-- STK Push dialog -->
  <rect x="102" y="130" width="136" height="140" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="170" y="155" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#374151">Payment Request</text>
  <text x="115" y="178" font-family="Arial" font-size="9" fill="#6B7280">Amount:</text>
  <text x="115" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#4CAF50">KES 2,500</text>
  <text x="115" y="218" font-family="Arial" font-size="9" fill="#6B7280">Business: KenZobe Tech</text>
  <rect x="115" y="235" width="55" height="22" rx="4" fill="#4CAF50"/><text x="127" y="250" font-family="Arial" font-size="9" fill="white">Pay</text>
  <rect x="178" y="235" width="55" height="22" rx="4" fill="#EF4444"/><text x="188" y="250" font-family="Arial" font-size="9" fill="white">Cancel</text>
  <!-- Phone notch -->
  <rect x="145" y="55" width="50" height="15" rx="7" fill="#374151"/>
  <!-- Code snippet -->
  <rect x="300" y="60" width="260" height="180" rx="8" fill="#1F2937"/>
  <text x="312" y="85" font-family="monospace" font-size="10" fill="#6EE7B7">// M-Pesa STK Push</text>
  <text x="312" y="105" font-family="monospace" font-size="10" fill="#93C5FD">const</text><text x="348" y="105" font-family="monospace" font-size="10" fill="white"> response =</text>
  <text x="325" y="122" font-family="monospace" font-size="10" fill="#FCD34D">await</text><text x="365" y="122" font-family="monospace" font-size="10" fill="#C4B5FD"> mpesa</text><text x="405" y="122" font-family="monospace" font-size="10" fill="white">.stkPush({</text>
  <text x="340" y="139" font-family="monospace" font-size="10" fill="#FCA5A5">phone</text><text x="380" y="139" font-family="monospace" font-size="10" fill="white">: </text><text x="395" y="139" font-family="monospace" font-size="10" fill="#86EFAC">"254720..."</text><text x="475" y="139" font-family="monospace" font-size="10" fill="white">,</text>
  <text x="340" y="156" font-family="monospace" font-size="10" fill="#FCA5A5">amount</text><text x="390" y="156" font-family="monospace" font-size="10" fill="white">: </text><text x="405" y="156" font-family="monospace" font-size="10" fill="#FCD34D">2500</text><text x="435" y="156" font-family="monospace" font-size="10" fill="white">,</text>
  <text x="340" y="173" font-family="monospace" font-size="10" fill="#FCA5A5">ref</text><text x="367" y="173" font-family="monospace" font-size="10" fill="white">: </text><text x="382" y="173" font-family="monospace" font-size="10" fill="#86EFAC">"INV-001"</text>
  <text x="325" y="190" font-family="monospace" font-size="10" fill="white">});</text>
  <!-- API flow arrows -->
  <g transform="translate(300, 270)">
    <rect width="80" height="35" rx="6" fill="white" stroke="#A7F3D0" stroke-width="1"/><text x="15" y="22" font-family="Arial" font-size="9" fill="#374151">Your App</text>
    <line x1="80" y1="17" x2="120" y2="17" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="0" width="80" height="35" rx="6" fill="#4CAF50"/><text x="133" y="22" font-family="Arial" font-size="9" fill="white">Daraja API</text>
    <line x1="200" y1="17" x2="240" y2="17" stroke="#10B981" stroke-width="2"/>
    <rect x="240" y="0" width="80" height="35" rx="6" fill="white" stroke="#A7F3D0" stroke-width="1"/><text x="255" y="22" font-family="Arial" font-size="9" fill="#374151">Customer</text>
  </g>
  <!-- Daraja label -->
  <rect x="310" y="330" width="240" height="40" rx="8" fill="#193d77"/>
  <text x="430" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Safaricom Daraja API Integration</text>
</svg>
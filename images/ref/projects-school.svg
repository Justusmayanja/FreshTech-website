  <text x="280" y="155" font-family="Arial" font-size="24" font-weight="bold" fill="#10B981">1,250</text>
  <rect x="410" y="100" width="130" height="70" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="430" y="125" font-family="Arial" font-size="11" fill="#6B7280">Attendance</text>
  <text x="430" y="155" font-family="Arial" font-size="24" font-weight="bold" fill="#F59E0B">94%</text>
  <rect x="560" y="100" width="100" height="70" rx="8" fill="#FEE2E2" stroke="#FECACA" stroke-width="1"/>
  <text x="575" y="125" font-family="Arial" font-size="11" fill="#6B7280">Fees Due</text>
  <text x="575" y="155" font-family="Arial" font-size="20" font-weight="bold" fill="#db1a1a">KES 2.4M</text>
  <!-- Chart -->
  <rect x="260" y="190" width="400" height="160" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="280" y="215" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Grade Distribution</text>
  <rect x="290" y="240" width="30" height="90" rx="4" fill="#10B981"/><text x="298" y="345" font-family="Arial" font-size="9" fill="#6B7280">A</text>
  <rect x="340" y="260" width="30" height="70" rx="4" fill="#34D399"/><text x="348" y="345" font-family="Arial" font-size="9" fill="#6B7280">B</text>
  <rect x="390" y="250" width="30" height="80" rx="4" fill="#6EE7B7"/><text x="398" y="345" font-family="Arial" font-size="9" fill="#6B7280">C</text>
  <rect x="440" y="280" width="30" height="50" rx="4" fill="#A7F3D0"/><text x="448" y="345" font-family="Arial" font-size="9" fill="#6B7280">D</text>
  <rect x="490" y="300" width="30" height="30" rx="4" fill="#D1FAE5"/><text x="498" y="345" font-family="Arial" font-size="9" fill="#6B7280">E</text>
  <!-- Graduation cap icon -->
  <g transform="translate(580, 240)">
    <path d="M40 20 L0 40 L40 60 L80 40 Z" fill="#10B981" opacity="0.7"/>

<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- Dashboard window -->
  <rect x="120" y="50" width="560" height="380" rx="12" fill="white" stroke="#A7F3D0" stroke-width="2"/>
  <rect x="120" y="50" width="560" height="36" rx="12" fill="#D1FAE5"/>
  <circle cx="144" cy="68" r="6" fill="#FCA5A5"/><circle cx="164" cy="68" r="6" fill="#FCD34D"/><circle cx="184" cy="68" r="6" fill="#86EFAC"/>
  <!-- Sidebar -->
  <rect x="120" y="86" width="120" height="344" fill="#F0FDF4"/>
  <rect x="130" y="100" width="100" height="24" rx="4" fill="#10B981"/><text x="145" y="116" font-family="Arial" font-size="10" fill="white">Dashboard</text>
  <rect x="130" y="134" width="100" height="24" rx="4" fill="transparent"/><text x="145" y="150" font-family="Arial" font-size="10" fill="#6B7280">Students</text>
  <rect x="130" y="168" width="100" height="24" rx="4" fill="transparent"/><text x="145" y="184" font-family="Arial" font-size="10" fill="#6B7280">Grades</text>
  <rect x="130" y="202" width="100" height="24" rx="4" fill="transparent"/><text x="145" y="218" font-family="Arial" font-size="10" fill="#6B7280">Attendance</text>
  <rect x="130" y="236" width="100" height="24" rx="4" fill="transparent"/><text x="145" y="252" font-family="Arial" font-size="10" fill="#6B7280">Fees</text>
  <!-- Stats cards -->
  <rect x="260" y="100" width="130" height="70" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>

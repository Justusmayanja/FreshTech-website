<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480"><stop offset="0%" stop-color="#FFF7ED"/><stop offset="100%" stop-color="#FFEDD5"/></linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- Phone mockup -->
  <rect x="280" y="30" width="240" height="420" rx="24" fill="#1F2937" stroke="#374151" stroke-width="2"/>
  <rect x="292" y="60" width="216" height="370" rx="4" fill="white"/>
  <!-- App header -->
  <rect x="292" y="60" width="216" height="50" fill="#db1a1a"/>
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Reserve a Table</text>
  <!-- Date picker -->
  <rect x="305" y="125" width="190" height="35" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="315" y="147" font-family="Arial" font-size="11" fill="#9A3412">Sat, March 21, 2026</text>
  <!-- Time slots -->
  <text x="305" y="185" font-family="Arial" font-size="11" font-weight="bold" fill="#374151">Select Time</text>
  <rect x="305" y="195" width="55" height="28" rx="6" fill="#db1a1a"/><text x="320" y="214" font-family="Arial" font-size="10" fill="white">6:00 PM</text>
  <rect x="370" y="195" width="55" height="28" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/><text x="385" y="214" font-family="Arial" font-size="10" fill="#9A3412">7:00 PM</text>
  <rect x="435" y="195" width="55" height="28" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/><text x="450" y="214" font-family="Arial" font-size="10" fill="#9A3412">8:00 PM</text>
  <!-- Guests -->
  <text x="305" y="255" font-family="Arial" font-size="11" font-weight="bold" fill="#374151">Guests</text>
  <g transform="translate(305, 265)">
    <circle cx="12" cy="12" r="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/><text x="12" y="16" text-anchor="middle" font-family="Arial" font-size="11" fill="#9A3412">-</text>
    <text x="50" y="18" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">4</text>
    <circle cx="88" cy="12" r="12" fill="#db1a1a"/><text x="88" y="16" text-anchor="middle" font-family="Arial" font-size="11" fill="white">+</text>
  </g>
  <!-- Menu preview -->
  <text x="305" y="320" font-family="Arial" font-size="11" font-weight="bold" fill="#374151">Popular Items</text>
  <rect x="305" y="330" width="190" height="40" rx="6" fill="#FFF7ED"/>
  <text x="315" y="348" font-family="Arial" font-size="10" fill="#374151">Nyama Choma</text>
  <text x="460" y="348" font-family="Arial" font-size="10" font-weight="bold" fill="#db1a1a">KES 800</text>
  <rect x="305" y="378" width="190" height="40" rx="6" fill="#FFF7ED"/>
  <text x="315" y="396" font-family="Arial" font-size="10" fill="#374151">Tilapia &amp; Ugali</text>
  <text x="460" y="396" font-family="Arial" font-size="10" font-weight="bold" fill="#db1a1a">KES 650</text>
  <!-- Notch -->
  <rect x="370" y="35" width="60" height="18" rx="9" fill="#374151"/>
  <!-- Floating elements -->
  <rect x="570" y="120" width="140" height="100" rx="10" fill="white" stroke="#FDBA74" stroke-width="1"/>
  <text x="640" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#6B7280">Booking Confirmed!</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#10B981">Confirmed</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial" font-size="9" fill="#6B7280">Table for 4 at 6 PM</text>
  <!-- Fork and knife decoration -->
  <g transform="translate(100, 180)" opacity="0.2">
    <rect x="20" y="0" width="6" height="80" rx="3" fill="#db1a1a"/>
    <rect x="60" y="0" width="6" height="80" rx="3" fill="#db1a1a"/>
    <ellipse cx="63" cy="0" rx="20" ry="35" fill="none" stroke="#db1a1a" stroke-width="5"/>
  </g>
</svg>
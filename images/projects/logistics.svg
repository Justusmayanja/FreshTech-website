<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- Main panel -->
  <rect x="120" y="50" width="560" height="380" rx="12" fill="white" stroke="#FDE68A" stroke-width="2"/>
  <rect x="120" y="50" width="560" height="36" rx="12" fill="#FEF3C7"/>
  <circle cx="144" cy="68" r="6" fill="#FCA5A5"/><circle cx="164" cy="68" r="6" fill="#FCD34D"/><circle cx="184" cy="68" r="6" fill="#86EFAC"/>
  <text x="400" y="73" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#92400E">Delivery Tracker</text>
  <!-- Map area -->
  <rect x="140" y="100" width="340" height="220" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <!-- Route line -->
  <path d="M200 280 Q250 200 320 230 Q380 260 420 160" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Map pins -->
  <circle cx="200" cy="280" r="8" fill="#10B981"/><text x="200" y="284" text-anchor="middle" font-family="Arial" font-size="8" fill="white">A</text>
  <circle cx="320" cy="230" r="6" fill="#F59E0B"/>
  <circle cx="420" cy="160" r="8" fill="#db1a1a"/><text x="420" y="164" text-anchor="middle" font-family="Arial" font-size="8" fill="white">B</text>
  <!-- Delivery truck icon on route -->
  <rect x="300" y="210" width="30" height="18" rx="3" fill="#F59E0B"/>
  <rect x="290" y="215" width="12" height="13" rx="2" fill="#92400E"/>
  <circle cx="296" cy="230" r="4" fill="#374151"/><circle cx="322" cy="230" r="4" fill="#374151"/>
  <!-- Status panel -->
  <rect x="500" y="100" width="160" height="310" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="515" y="125" font-family="Arial" font-size="11" font-weight="bold" fill="#374151">Package Status</text>
  <!-- Status steps -->
  <circle cx="530" cy="155" r="8" fill="#10B981"/><text x="545" y="155" font-family="Arial" font-size="10" fill="#374151">Order Placed</text><text x="545" y="168" font-family="Arial" font-size="8" fill="#9CA3AF">10:30 AM</text>
  <line x1="530" y1="165" x2="530" y2="195" stroke="#10B981" stroke-width="2"/>
  <circle cx="530" cy="205" r="8" fill="#10B981"/><text x="545" y="205" font-family="Arial" font-size="10" fill="#374151">Picked Up</text><text x="545" y="218" font-family="Arial" font-size="8" fill="#9CA3AF">11:15 AM</text>
  <line x1="530" y1="215" x2="530" y2="245" stroke="#10B981" stroke-width="2"/>
  <circle cx="530" cy="255" r="8" fill="#F59E0B"/><text x="545" y="255" font-family="Arial" font-size="10" fill="#374151">In Transit</text><text x="545" y="268" font-family="Arial" font-size="8" fill="#9CA3AF">12:00 PM</text>
  <line x1="530" y1="265" x2="530" y2="295" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="530" cy="305" r="8" fill="#E5E7EB"/><text x="545" y="305" font-family="Arial" font-size="10" fill="#9CA3AF">Delivered</text><text x="545" y="318" font-family="Arial" font-size="8" fill="#9CA3AF">Est. 2:00 PM</text>
  <!-- Package info -->
  <rect x="140" y="340" width="340" height="70" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="160" y="365" font-family="Arial" font-size="11" font-weight="bold" fill="#374151">Package #KZ-2026-0342</text>
  <text x="160" y="385" font-family="Arial" font-size="10" fill="#6B7280">Eastleigh to Westlands - 2 items - KES 350</text>
  <rect x="380" y="355" width="80" height="28" rx="6" fill="#F59E0B"/><text x="400" y="374" font-family="Arial" font-size="10" fill="white">Track Live</text>
</svg>